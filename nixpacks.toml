[phases.setup]
nixPkgs = [
  "nodejs_22",
  "(php85.withExtensions (pe: pe.enabled ++ [ pe.all.pdo_mysql pe.all.mysqli pe.all.openssl pe.all.mbstring pe.all.zip pe.all.gd pe.all.fileinfo pe.all.bcmath pe.all.pdo_sqlite pe.all.sodium pe.all.intl ]))",
  "php85Packages.composer",
]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader",
  "npm install --no-audit --no-fund",
]

[phases.build]
cmds = [
  "npm run build",
]

[start]
cmd = "php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan serve --host=0.0.0.0 --port=$PORT"
